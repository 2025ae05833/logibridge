# LogiEdge pilot fleet inventory.
#
# For the demo a single truck is modelled as the local machine, so the
# playbook runs end to end without 85 Raspberry Pis on the desk. At fleet
# scale each truck is one line here with its own address, and the same
# playbook runs with --forks to deploy in parallel.

[trucks]
TRK-001 ansible_connection=local

# Production shape, for reference:
# TRK-001 ansible_host=10.42.0.11 ansible_user=logibridge
# TRK-002 ansible_host=10.42.0.12 ansible_user=logibridge

[trucks:vars]
local_registry=localhost:5000
broker_host=localhost
image_tag=latest
